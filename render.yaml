services:
  - type: web
    name: reconiq-api
    runtime: docker
    plan: free
    dockerfilePath: ./Dockerfile
    healthCheckPath: /health
    autoDeploy: true
    envVars:
      - key: ENVIRONMENT
        value: production
      - key: DATABASE_URL
        sync: false
      - key: SECRET_KEY
        generateValue: true
      - key: CORS_ORIGINS
        sync: false
      - key: MAX_UPLOAD_MB
        value: "10"
      - key: DEMO_RUN_QUOTA
        value: "20"
